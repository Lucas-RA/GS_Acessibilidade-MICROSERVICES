spring.application.name=gs-acessibilidade-api
server.port=8080
spring.profiles.default=dev

springdoc.swagger-ui.path=/
api.version=v1

# Necessário para o Swagger montar as URLs corretas atrás do ingress do Azure
server.forward-headers-strategy=framework
spring.jpa.open-in-view=false

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
