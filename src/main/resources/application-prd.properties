# Azure SQL: todas as informações de conexão vêm de variáveis de ambiente.
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL}:${DB_SERVER_PORT:1433};databaseName=${DB_SCHEMA};encrypt=true;trustServerCertificate=false;loginTimeout=30
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# O banco do Azure nasce vazio; o Hibernate cria as tabelas no primeiro deploy.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
